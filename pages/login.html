<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Big Data E-Learning</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <a class="site-logo" href="../index.html">Big Data E-Learning</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="nav-toggle-line"></span>
        <span class="nav-toggle-line"></span>
        <span class="nav-toggle-line"></span>
        <span class="sr-only">Toggle navigation</span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Main navigation">
        <a href="../index.html">Home</a>
        <a href="module-1.html">Modules</a>
        <a href="team.html">Team</a>
        <a href="media.html">Media</a>
        <a href="final-quiz.html">Final Quiz</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
      </nav>
    </div>
  </header>

  <main class="auth-main">
    <section class="auth-card">
      <p class="eyebrow">Student Access</p>
      <h1>Login</h1>
      <p class="auth-note">Sign in screen for the learning portal interface.</p>

      <form class="auth-form" data-prototype-form>
        <label for="login-email">Email or username</label>
        <input id="login-email" name="login-email" type="text" placeholder="student@example.com" required>

        <label for="login-password">Password</label>
        <input id="login-password" name="login-password" type="password" placeholder="Enter password" required>

        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox" name="remember">
            Remember this device
          </label>
          <a href="register.html">Need an account?</a>
        </div>

        <button class="button button-primary" type="submit">Login to Course</button>
        <p class="form-message" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <p>&copy; 2026 Big Data E-Learning Project Team.</p>
      <p>Built with HTML, CSS, and vanilla JavaScript.</p>
    </div>
  </footer>

  <script src="../js/app.js?v=2"></script>
</body>
</html>

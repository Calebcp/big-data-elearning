<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Entry | Big Data E-Learning</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <a class="site-logo" href="../index.html">Big Data E-Learning</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="nav-toggle-line"></span>
        <span class="nav-toggle-line"></span>
        <span class="nav-toggle-line"></span>
        <span class="sr-only">Toggle navigation</span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Main navigation">
        <a href="../index.html">Home</a>
        <a href="module-1.html">Modules</a>
        <a href="team.html">Team</a>
        <a href="media.html">Media</a>
        <a href="final-quiz.html">Final Quiz</a>
      </nav>
    </div>
  </header>

  <main class="auth-main">
    <section class="auth-card">
      <p class="eyebrow">Course Entry</p>
      <h1>Continue learning</h1>
      <p class="auth-note">Choose where you want to begin in the Big Data course.</p>

      <form class="auth-form" data-course-form>
        <label for="learner-name">Name</label>
        <input id="learner-name" name="learner-name" type="text" placeholder="Your name" required>

        <label for="starting-point">Starting point</label>
        <select id="starting-point" name="starting-point">
          <option>Start with Module 1</option>
          <option>Review the 5 Vs</option>
          <option>Practice the final quiz</option>
        </select>

        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox" name="ready">
            I am ready to begin
          </label>
          <a href="module-1.html">Open Module 1</a>
        </div>

        <button class="button button-primary" type="submit">Enter Course</button>
        <p class="form-message" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <p>&copy; 2026 Big Data E-Learning Project Team.</p>
      <p>A complete beginner-friendly guide to Big Data.</p>
    </div>
  </footer>

  <script src="../js/app.js?v=2"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Goal | Big Data E-Learning</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <a class="site-logo" href="../index.html">Big Data E-Learning</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="nav-toggle-line"></span>
        <span class="nav-toggle-line"></span>
        <span class="nav-toggle-line"></span>
        <span class="sr-only">Toggle navigation</span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Main navigation">
        <a href="../index.html">Home</a>
        <a href="module-1.html">Modules</a>
        <a href="team.html">Team</a>
        <a href="media.html">Media</a>
        <a href="final-quiz.html">Final Quiz</a>
      </nav>
    </div>
  </header>

  <main class="auth-main">
    <section class="auth-card">
      <p class="eyebrow">Learning Goal</p>
      <h1>Set your study focus</h1>
      <p class="auth-note">Set a learning goal before starting the Big Data course.</p>

      <form class="auth-form" data-course-form>
        <label for="register-name">Full name</label>
        <input id="register-name" name="register-name" type="text" placeholder="Your name" required>

        <label for="learning-goal">Learning goal</label>
        <select id="learning-goal" name="learning-goal">
          <option>Understand Big Data basics</option>
          <option>Prepare for the final quiz</option>
          <option>Explore real-world data examples</option>
        </select>

        <label for="confidence-level">Current confidence</label>
        <select id="confidence-level" name="confidence-level">
          <option>New to Big Data</option>
          <option>I know a few terms</option>
          <option>Ready to review and test myself</option>
        </select>

        <button class="button button-primary" type="submit">Save Study Focus</button>
        <p class="form-message" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <p>&copy; 2026 Big Data E-Learning Project Team.</p>
      <p>A complete beginner-friendly guide to Big Data.</p>
    </div>
  </footer>

  <script src="../js/app.js?v=2"></script>
</body>
</html>
